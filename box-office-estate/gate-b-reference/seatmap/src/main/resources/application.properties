# seatmap configuration. Part of box-office-estate (module 07, lab 07-hackathon-two-worlds).
# The datasource URL and credentials come from the environment in docker-compose.yml.
server.port=8080
spring.application.name=seatmap
spring.main.banner-mode=off
management.endpoints.web.exposure.include=health
spring.datasource.hikari.maximum-pool-size=10
# On SIGTERM, requests in progress get 5 seconds to finish, and a request
# waiting for a database connection gives up after 5 seconds, so the service
# stops before the container runtime's 10-second kill.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=5s
spring.datasource.hikari.connection-timeout=5000
