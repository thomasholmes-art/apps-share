# inventory configuration (obs-sample-estate, all stages).
server.port=3001
spring.application.name=inventory
spring.main.banner-mode=off
spring.main.log-startup-info=false

# Embedded H2 store holding table stock_line (schema.sql, data.sql).
spring.datasource.url=jdbc:h2:mem:inventory;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always

# Pattern-based console logging, one line per event. The level field is
# ${LOG_LEVEL_PATTERN:-%5p}, so LOGGING_PATTERN_LEVEL from lab 03's override
# (task 3b) changes what the line prints. `cid=` is the correlation id the
# request filter puts in the MDC, or `-` outside a request. The host log
# collector parses these lines into the same attribute names checkout-api's
# JSON records carry. Spring Boot structured logging is deliberately off.
# `\\${` is escaped twice (once for the properties format, once for Spring's
# own placeholder resolution) so that Logback, not Spring, resolves
# ${LOG_LEVEL_PATTERN:-%5p}; Spring would read `:-%5p` as the default `-%5p`.
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSS'Z',UTC} \\${LOG_LEVEL_PATTERN:-%5p} \\${PID:- } --- [%15.15t] cid=%X{correlation_id:--} %logger{0} : %m%n
logging.level.root=WARN
logging.level.com.decoded.inventory=INFO

# Reservation latency outside the reconciliation window (lab 04 artefact
# reserve-p95-last-hour.csv: p50 about 43 ms, p95 about 78 ms). The SELECT on
# stock_line takes about 31 ms; the rest is a processing delay drawn per
# request from these bands.
inventory.latency.select-ms=31
inventory.latency.bands=85:5-12,10:20-40,5:40-70

# Stock reconciliation: every five minutes at minutes 3, 8, 13, ... UTC, for
# about 50 seconds. Reservations in that window wait for their stock rows to
# be recounted: 60-100 ms each, and about one in five waits 0.8-1.1 s, so
# the p95 of that one-minute bucket lands in the 0.8-1.1 s band.
inventory.reconcile.cron=${INVENTORY_RECONCILE_CRON:0 3/5 * * * *}
inventory.reconcile.duration-ms=50000
inventory.reconcile.recount-ms=60-100
inventory.reconcile.long-recount-ms=800-1100
inventory.reconcile.long-recount-percent=20
inventory.reconcile.slow-warn-ms=500

# Holds expire after this long; a background executor releases them.
inventory.hold-ttl-ms=30000
